[workspace]
members = [
    "crates/newton-core",
    "crates/newton-cpu",
    "crates/newton-devices",
    "crates/newton-utils",
    "crates/newton-m68k",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
authors = ["NewtonEmu Contributors"]
repository = "https://github.com/YourUsername/NewtonEmu"

[workspace.dependencies]
# Internal crates
newton-core = { path = "crates/newton-core" }
newton-cpu = { path = "crates/newton-cpu" }
newton-devices = { path = "crates/newton-devices" }
newton-utils = { path = "crates/newton-utils" }
newton-m68k = { path = "crates/newton-m68k" }

# Graphics (wgpu only - no GUI frameworks)
wgpu = "29"
winit = "0.30"
pollster = "0.4"

# JIT compilation (Cranelift)
cranelift-codegen = "0.131"
cranelift-frontend = "0.131"
cranelift-jit = "0.131"
cranelift-module = "0.131"
cranelift-native = "0.131"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
byteorder = "1.5"
parking_lot = "0.12"
num-traits = "0.2"
bitflags = "2.6"
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"

# Compression and archive formats
flate2 = "1.1"          # gzip/zlib compression (for DMG)
bzip2 = "0.6"           # bzip2 compression (for DMG)
zip = "8.6"             # ZIP archive support
plist = "1.9"           # Property list parsing (for DMG metadata)
udif = "0.3"            # Apple DMG/UDIF disk image support

# Audio (optional for now)
# cpal = "0.15"

# Testing & Benchmarking
criterion = "0.5"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"

[package]
name = "newton-emu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "newton-emu"
path = "src/main.rs"

[dependencies]
newton-core = { workspace = true }
newton-cpu = { workspace = true }
newton-devices = { workspace = true }
newton-utils = { workspace = true }
newton-m68k = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
